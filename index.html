<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Finder</title>
    <!-- Links to css and javasript files -->
     <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header id="site-header">
        <div class="brand">
            <button id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="primary-nav">
                <span class="sr-only">Toggle navigation</span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <h1>Movie Finder</h1>
        </div>

        <nav id="primary-nav" class="primary-nav" aria-label="Main navigation">
            <a href="#finder-form-section">Finder</a>
            <a href="#streaming-services-list">Services</a>
            <a href="#results">Recommended</a>
        </nav>

        <a id="view-watchlist-button" href="watchlist.html" role="button">Watchlist</a>
    </header>

    <main>

            <div id="success-banner" class="search-banner" style="display:none;">
                <p>✅ Recommendations successfully generated!</p>
            </div>

        <section id="finder-form-section" class="anchor-target">
            <h2>Tell Us What You're in the Mood For</h2>

            <form id="finder-form">   <!-- JS Target: Handle form submission to generate recommendations -->

                <!-- Mood Dropdown -->
                <div class="form-group">
                    <label for="mood-select">Select your current mood:</label>
                    <!-- JS: Read this value to filter movie search -->
                    <select id="mood-select">  
                        <option value="">-- All Moods --</option>
                        <option value="happy">Happy / Feel-Good</option>
                        <option value="excited">Exciting / Adrenaline Rush</option>
                        <option value="calm">Calm / Relaxed</option>
                        <option value="pensive">Thought-provoking / Pensive</option>
                        <option value="scared">Scary / Thrilled</option>
                        <option value="silly">Silly / Need a Laugh</option>
                        <option value="sad">Sad / Want a Good Cry</option>
                        <option value="nostalgic">Nostalgic / Retro</option>
                        <option value="educational">Educational / Learn Something New</option>
                        <option value="suspenseful">Suspenseful / On the Edge of Your Seat</option>
                    </select>
                </div>

                <!-- Genre Dropdown -->
                <div class="form-group">
                    <label for="genre-select">Select a Genre:</label>
                    <!-- JS: Read this value to filter movie search -->
                    <select id="genre-select"> 
                        <option value="">-- All Genres --</option>
                        <option value="action">Action</option>
                        <option value="comedy">Comedy</option>
                        <option value="drama">Drama</option>
                        <option value="horror">Horror</option>
                        <option value="thriller">Thriller</option>
                        <option value="scifi">Science Fiction</option>
                        <option value="fantasy">Fantasy</option>
                        <option value="romance">Romance</option>
                        <option value="mystery">Mystery</option>
                        <option value="adventure">Adventure</option>
                        <option value="documentary">Documentary</option>
                        <option value="animation">Animation</option>
                        <option value="family">Family</option>
                        <option value="western">Western</option>
                        <option value="musical">Musical</option>
                        <option value="biography">Biography</option>
                        <option value="crime">Crime</option>
                        <option value="history">History</option>
                        <option value="war">War</option>
                    </select>
                </div>
                
                <!-- Content Type Dropdown -->
                <div class="form-group">
                    <label for="content-type-select">Content Type:</label>
                    <!-- JS: Read this value to filter movie search -->
                    <select id="content-type-select" name="content-type">  
                        <option value="">-- All Types --</option>
                        <option value="movie">Movie</option>
                        <option value="tv">TV Show</option>
                    </select>
                </div>

                <!-- Streaming Services Checkboxes -->
                <div class="form-group">
                    <details id="services-accordion" class="services-accordion" open>
                        <summary>Streaming Services You Have</summary>
                        <div id="streaming-services-list" class="anchor-target">
                            <!-- JS: Collect selected checkboxes to filter results -->
                            <label class="service-pill">
                                <input type="checkbox" id="service-amazonprime" name="streaming-service" value="Amazon Prime Video">
                                <span>Amazon Prime Video</span>
                            </label>

                            <label class="service-pill">
                                <input type="checkbox" id="service-appletv" name="streaming-service" value="Apple TV Plus">
                                <span>Apple TV+</span>
                            </label>
                            
                            <label class="service-pill">
                                <input type="checkbox" id="service-disneyplus" name="streaming-service" value="Disney Plus">
                                <span>Disney Plus</span>
                            </label>

                            <label class="service-pill">
                                <input type="checkbox" id="service-hbo" name="streaming-service" value="HBO Max">
                                <span>HBO Max</span>
                            </label>

                            <label class="service-pill">
                                <input type="checkbox" id="service-hulu" name="streaming-service" value="Hulu">
                                <span>Hulu</span>
                            </label>
                            
                            <label class="service-pill">
                                <input type="checkbox" id="service-netflix" name="streaming-service" value="Netflix">
                                <span>Netflix</span>
                            </label>

                            <label class="service-pill">
                                <input type="checkbox" id="service-paramount" name="streaming-service" value="Paramount Plus">
                                <span>Paramount+</span>
                            </label>

                            <label class="service-pill">
                                <input type="checkbox" id="service-peacock" name="streaming-service" value="Peacock">
                                <span>Peacock</span>
                            </label>

                            <label class="service-pill">
                                <input type="checkbox" id="service-youtubetv" name="streaming-service" value="YouTube TV">
                                <span>YouTube TV</span>
                            </label>
                        </div>
                    </details>
                </div>

                <!-- Previously Liked Movies Input -->
                <div class="form-group">
                    <!-- JS: Parse user input to filter movie search -->
                    <label for="liked-movies">Previously Liked Movies:</label>
                    <input type="text" id="liked-movies" placeholder="Separate titles with commas"> 
                </div>

                <!-- JS Target: Triggers movie search / recommendation generation -->
                <button type="submit" id="recommend-button">Find Movies</button>

            </form>
        </section>


        <!-- RECOMMENDED MOVIES SECTION -->
        <section id="results-container">
            <h2>Recommended for You</h2>

            <div id="loading-spinner" class="loading-state" style="display:none;">
                <p>Generating recommendations...</p>
            </div>

            <div id="results" class="movie-grid recommended-grid anchor-target"></div>
        </section>

    </main>

    <footer>
        <p>
            Movie and TV data provided by <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDb</a>. 
            Streaming availability provided by <a href="https://www.justwatch.com/" target="_blank" rel="noopener noreferrer">JustWatch</a>.
        </p>
    </footer>

    <script type="module" src="js/main.js"></script>

</body>
</html>
